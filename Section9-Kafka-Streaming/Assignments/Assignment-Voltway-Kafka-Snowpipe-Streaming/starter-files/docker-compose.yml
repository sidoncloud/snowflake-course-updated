# Voltway lab: a single-node Kafka broker plus a Kafka Connect worker that
# installs the Snowflake Kafka connector when it starts.
#
# Start:  bash 04_start_kafka.sh        (runs "docker compose up -d" and waits)
# Stop:   bash 11_teardown_kafka.sh     (removes the containers and their data)
#
# Ports on your machine:
#   9092  Kafka broker (only needed if you connect a client from your laptop)
#   8083  Kafka Connect REST API (the scripts register the connector here)
name: voltway-kafka-lab

services:
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    hostname: kafka
    container_name: voltway-kafka
    ports:
      - "9092:9092"
    environment:
      # KRaft mode: one container is both the broker and the controller, so
      # there is no ZooKeeper to run.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created explicitly by 05_register_connector.sh, with the
      # partition counts this lab needs.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: Vm9sdHdheUxhYkthZmthMQ

  connect:
    image: confluentinc/cp-kafka-connect-base:7.6.1
    hostname: connect
    container_name: voltway-connect
    depends_on:
      - kafka
    ports:
      - "8083:8083"
    environment:
      CONNECT_BOOTSTRAP_SERVERS: kafka:29092
      CONNECT_REST_ADVERTISED_HOST_NAME: connect
      CONNECT_GROUP_ID: voltway-connect-cluster
      CONNECT_CONFIG_STORAGE_TOPIC: _voltway_connect_configs
      CONNECT_OFFSET_STORAGE_TOPIC: _voltway_connect_offsets
      CONNECT_STATUS_STORAGE_TOPIC: _voltway_connect_status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      CONNECT_PLUGIN_PATH: /usr/share/java,/usr/share/confluent-hub-components
    command:
      - bash
      - -c
      - |
        confluent-hub install --no-prompt snowflakeinc/snowflake-kafka-connector:2.5.0
        /etc/confluent/docker/run
